<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OwlsGuild band</title>
<style>html,body{margin:0;padding:0;background:#fff;}iframe{border:0;display:block;}</style>
</head><body>
<iframe id="stage" src="about:blank" scrolling="no"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const W = parseInt(q.get("w") || "1440", 10);
  const Y = parseInt(q.get("y") || "0", 10);
  const stage = document.getElementById("stage");
  stage.style.width = W + "px";
  stage.style.height = "900px";
  stage.src = "index.html";
  stage.addEventListener("load", () => {
    const d = stage.contentDocument;
    stage.style.height = d.documentElement.scrollHeight + "px";
    window.scrollTo(0, Y);
    window.__ready = { width: W, y: Y, contentHeight: d.documentElement.scrollHeight };
  });
</script>
</body></html>
